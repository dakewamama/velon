name: Console image

on:
  push:
    branches: [wip]
    paths: ["app/**", "runtime/**", "sdk/**", "arm/**", ".github/workflows/console-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/deploy/Dockerfile
          build-args: VELON_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/dakewamama/velon-console:latest
            ghcr.io/dakewamama/velon-console:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
