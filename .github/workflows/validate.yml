name: validate

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [arm, sdk, runtime]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.component == 'sdk'
        with:
          bun-version: 1.3.14
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - if: matrix.component == 'sdk'
        run: bun run fixture:squads
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  sdk-typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  browser-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VELON_REVISION: ${{ github.sha }}
      CATALOGER_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install from the app lockfile
        working-directory: app
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: npx --yes npm@10.9.9 ci --ignore-scripts
      - working-directory: app
        run: bun run typecheck && bun run format:check && bun run test && bun run build
      - working-directory: runtime
        run: cargo build --locked -p catalyst-indexer --bin authorization-api
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - working-directory: app
        run: node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Browser fixture conformance (no public-chain actions)
        working-directory: app
        env:
          AUTHZ_BIN: ${{ github.workspace }}/runtime/target/debug/authorization-api
          CATALOGER_DIR: ${{ github.workspace }}/runtime
        run: bun run test:e2e
