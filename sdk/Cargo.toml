[package]
name = "catalyst-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
arm = { path = "../arm" }
solana-instruction = "=3.5.1"
solana-pubkey = { version = "=4.4.0", features = ["curve25519"] }
solana-account = "=4.7.0"
solana-program-pack = "=3.1.0"
spl-token-interface = "=3.0.0"
spl-token-2022-interface = "=3.1.2"
subscriptions = "=0.5.0"

[dev-dependencies]
serde_json = "1"
mollusk-svm = "=0.16.2"
mollusk-svm-programs-token = { version = "=0.16.2", default-features = false, features = ["token", "token-2022"] }
solana-program-option = "=3.1.0"
sha2 = "0.10"
base64 = "0.22"
spl-token-interface-v2 = { package = "spl-token-interface", version = "=2.0.0" }
