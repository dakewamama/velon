<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: "Geist"; src: url("../fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: "Geist", sans-serif; color: #eef5f1;
  background: radial-gradient(60% 70% at 80% 40%, rgb(63 224 165 / .18), transparent 70%), #051f18;
  display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 40px; padding: 0 72px; box-sizing: border-box;
}
.brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 36px; }
.brand svg { width: 40px; height: 40px; }
h1 { margin: 0; font-size: 84px; line-height: .95; letter-spacing: -.045em; font-weight: 600; }
p { margin: 28px 0 0; font-size: 26px; line-height: 1.4; color: #a9c2b8; }
img { width: 100%; border-radius: 22px; box-shadow: 0 40px 80px -30px rgb(0 0 0 / .6); transform: translateY(70px); }
</style>
</head>
<body>
<div>
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#104233"/><path d="M9 11.5 14.6 21.5 23.5 9" fill="none" stroke="#3fe0a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Velon</div>
  <h1>Take back every approval.</h1>
  <p>Proof before you sign, and after. Open source, for Solana.</p>
</div>
<img src="../shots/review.png" alt="" />
</body>
</html>
